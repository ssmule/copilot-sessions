    about: >-
      Not sure it is a bug yet, or want to talk a feature through before
      writing it up? Start here.
  - name: Contributing guide
    url: https://github.com/smaharajan/copilot-sessions/blob/main/CONTRIBUTING.md
    about: >-
      How the code is laid out, what needs a test, and how to run the same two
      commands CI does.
