[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-sessions"
version = "1.0.0"
description = "A terminal application for your GitHub Copilot CLI sessions — list, search, inspect and resume."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sommaharajan" }]
keywords = ["github-copilot", "cli", "sessions", "terminal", "tui"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []  # zero runtime dependencies — stdlib only

[project.scripts]
cs = "cs.cli:run"

[project.urls]
Homepage = "https://github.com/ssmule/copilot-sessions"

[tool.setuptools]
packages = ["cs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
